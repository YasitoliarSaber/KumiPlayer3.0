# KumiPlayer 自有 MPV 强制配置（分层架构）
#
# 本文件属于 KumiPlayer 自有层（mpv/config/kumiplayer/），
# 通过启动参数 --include 在整合包 mpv.conf 之后追加解析（MPV 官方手册：
# --include 在默认设置文件之后解析）。用户替换 portable_config 整合包后，
# 以下 KumiPlayer 强制配置仍然生效，保证应用功能不受影响。
#
# 参考：https://mpv.io/manual/stable/

# 解码偏好由 portable_config 决定；默认 hwdec=auto-safe 在可替换层中设置。
# 自有层不覆盖用户显式选择的软解或其他硬解方式。

# 统计信息页使用 KumiPlayer 中文化的 stats.lua。
# load-stats-overlay=no 禁用 mpv 内置英文 stats 脚本，避免同名脚本被
# 自动重命名为 stats2 造成重复页面与键位冲突（MPV 官方手册 --load-stats-overlay）。
load-stats-overlay=no

# 禁用 mpv 原生 OSD 进度条：滚轮/方向键调节进度时不再弹出粗进度条，
# 进度反馈由 uosc 时间轴（timeline）提供。放在自有层保证替换整合包后仍生效
# （MPV 官方手册 --osd-bar / --osd-on-seek）。
osd-bar=no
osd-on-seek=no

# 受控队列安全边界：忽略作为文件参数传入的目录，禁止 mpv 把目录展开成
# 播放列表。KumiPlayer 的播放列表由后端按季度构建，进度回写按路径映射到该
# 队列；一旦目录被展开（例如把文件夹拖进播放器窗口），就会出现队列外的条目，
# 使进度映射失效。此项与 kumiplayer_bindings.lua 的 Ctrl+v 强制屏蔽、
# 启动参数 --autocreate-playlist=no 构成三层防护。
# MPV 官方手册 --directory-mode（可选 auto|lazy|recursive|ignore；默认 auto 会
# 退化为 lazy，即仍会列出目录内容）。
directory-mode=ignore

# ── 字幕：动漫外挂字幕的自动挂载与中文语言优先级 ──────────────────
# 本节位于 KumiPlayer 自有层：用户整体替换 portable_config 后字幕行为保持不变
# （--include 在整合包 mpv.conf 之后解析，因此这里的取值优先）。
#
# sub-auto=fuzzy：mpv 默认 exact 只认与视频完全同名的字幕，而动漫外挂字幕普遍
# 带发布组与语言后缀（.sc/.tc/.chs/.cht/.zh-Hans 等），exact 会漏挂。
# 注意 fuzzy 只挂「文件名以视频名开头」或「文件名含视频名」的字幕；与视频完全
# 不同名的字幕不会被自动挂载（MPV 官方手册 --sub-auto）。
sub-auto=fuzzy

# sub-file-paths：fuzzy 不搜索子目录，而 mpv 在 Windows 上默认不扫描任何子目录，
# 因此放在 sub/、subs/、subtitles/、字幕/ 等目录里的同名字幕此前完全不会被加载。
# 实测（内置 mpv v0.41.0）：不配置时上述目录均未加载；配置后同一批用例全部加载。
# ⚠️ 分隔符在 Windows 上是分号，不是冒号：写成冒号会被当成一个不存在的路径，
# 表现为「配了也不生效」（MPV 官方手册 --sub-file-paths）。
sub-file-paths=sub;subs;subtitles;Subtitles;字幕

# slang：字幕语言优先级（MPV 官方手册 --slang）。
# ⚠️ 顺序就是优先级：mpv 用 `score = INT_MAX - slang 索引` 给轨道打分
# （mpv v0.41.0 源码 misc/language.c 的 mp_match_lang），索引越小分越高。
# 因此必须把所有简体代码排在所有繁体代码之前，否则简体轨会输给繁体轨。
# 实测（内置 mpv v0.41.0，外挂 .chs.ass + .tc.ass）：旧顺序
#   zh,zh-cn,zh-hans,zh-hant,zh-tw,zh-hk,zh-mo,sc,tc,chs,cht
# 会选中 tc（繁体）；按本节顺序改为选中 chs（简体）。同批由旧顺序误判给繁体的
# 组合还有 .chs+.zh-Hant、.chs+.zh-TW、.sc+.zh-Hant、.cn+.tc、.gb+.cht。
#
# 分组：先简体（sc/chs 是发布组通用简写，cn/gb 亦为常见简写），再泛中文
# （zh 经 mpv 归一化同时匹配 chi/zho），最后繁体。刻意不列日语/英语：没有中文轨
# 时保持未选中，交给 subs-fallback 与手动选择——2026-09-22 实测 slang 含 ja/jp
# 会导致一条字幕都不选（原声语言命中后 mpv 直接放弃选轨）。
slang=sc,chs,zh-cn,zh-hans,zh-sg,cn,gb,zh,zh-hant,zh-tw,zh-hk,zh-mo,tc,cht

# subs-fallback=default：内封字幕的语言标记经常不规范（Chinese / und / 缺失），
# 此时按 slang 匹配不到任何轨道。默认的 no 会让字幕一条都不选，表现为「字幕不
# 自动加载」。default 允许回退到发布方标记为 default 的字幕轨。
# 实测（内置 mpv v0.41.0，内封单字幕轨）：lang=Chinese / und / 无标记但带 default
# 标记时，no 不选、default 选中；未标记 default 的非中文轨在 default 下也不会被
# 误选，因此比 yes 保守（yes 会选中任意第一条轨道）。
# （MPV 官方手册 --subs-fallback，可选 no|default|yes）
subs-fallback=default

# 即使音轨语言与字幕语言相同（例如国配 + 中文字幕），也允许按 slang 自动选中字幕。
# mpv 的 subs-with-matching-audio=auto（默认值）在音轨语言命中 slang 时不会自动选
# 字幕，中配内容会表现为「字幕不显示」（源码 player/loadfile.c 的 subs_matching_audio）。
subs-with-matching-audio=yes
